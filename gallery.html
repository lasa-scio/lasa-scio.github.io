---
layout: default
title: LASA SciO - Gallery
---
<link rel="stylesheet" href="assets/css/photoswipe.css">
<link rel="stylesheet" href="assets/css/default-skin/default-skin.css">
<script src="assets/js/photoswipe.min.js"></script>
<script src="assets/js/photoswipe-ui-default.min.js"></script>
<script>
var folderId="{{ site.data.gallery.folder_id }}";
var apiKey="{{ site.data.gallery.api_key }}";
var firstPageUrl="https://www.googleapis.com/drive/v2/files?maxResults=9999999&orderBy=createdDate%20desc&q='"+folderId+"'+in+parents&key="+apiKey;
var items=[];
function addToGallery(url){
  if(!url||url.startsWith("undefined")){
    renderThumbnails();
    return;
  }
  $.getJSON(url).done(function(data){
    $.each(data.items,function(i,item){
      if(item.mimeType.indexOf("image")===0){
        items.push({
          src:  "https://drive.google.com/uc?export=view&id="+item.id,
          msrc: item.thumbnailLink,
          w:    item.imageMediaMetadata.width,
          h:    item.imageMediaMetadata.height
        });
      }
    });
    addToGallery(data.nextLink+"&key="+apiKey);
  });
}
function renderThumbnails(){
  $.each(items,function(idx,item){
    var thumb=$("<a>")
      .addClass("thumbnail")
      .attr("data-index",idx)
      .css("background-image","url("+item.msrc+")")
      .attr("href",item.src);
    $("#gallery").append(thumb);
    thumb.on("click",function(e){
      e.preventDefault();
      new PhotoSwipe($(".pswp")[0],PhotoSwipeUI_Default,items,{
        index:idx,
        history:false
      }).init();
    });
  });
}
addToGallery(firstPageUrl);
</script>

<div class="center">
  <h1 style="color: #0c2340">LASA SciO Gallery</h1>
</div>
<br/>
<div id="gallery"></div>

<div class="pswp" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="pswp__bg"></div>
  <div class="pswp__scroll-wrap">
    <div class="pswp__container">
      <div class="pswp__item"></div>
      <div class="pswp__item"></div>
      <div class="pswp__item"></div>
    </div>
    <div class="pswp__ui pswp__ui--hidden">
      <div class="pswp__top-bar">
        <div class="pswp__counter"></div>
        <button class="pswp__button pswp__button--close" title="Close"></button>
        <button class="pswp__button pswp__button--share" title="Share"></button>
        <button class="pswp__button pswp__button--fs" title="Toggle fullscreen"></button>
        <button class="pswp__button pswp__button--zoom" title="Zoom in"></button>
        <div class="pswp__preloader">
          <div class="pswp__preloader__icn">
            <div class="pswp__preloader__cut">
              <div class="pswp__preloader__donut"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="pswp__share-modal pswp__share-modal--hidden pswp__single-tap">
        <div class="pswp__share-tooltip"></div>
      </div>
      <button class="pswp__button pswp__button--arrow--left" title="Previous"></button>
      <button class="pswp__button pswp__button--arrow--right" title="Next"></button>
      <div class="pswp__caption">
        <div class="pswp__caption__center"></div>
      </div>
    </div>
  </div>
</div>
